<div style="font-family:Arial,sans-serif;max-width:640px;margin:0 auto;background:#0f172a;color:#e2e8f0;padding:24px;border-radius:12px">
  <p style="margin:0 0 10px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#f97316;font-weight:700">1625 Autolab</p>
  <h2 style="margin:0 0 6px;font-size:24px;color:#ffffff">Appointment Rescheduled</h2>
  <p style="margin:0 0 20px;color:#94a3b8;font-size:14px">Hi {{ name }}, your appointment has been rescheduled.</p>
  
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
         style="border:1px solid #334155;border-radius:8px;overflow:hidden;background:#111827;margin-bottom:24px">
    <tr>
      <td style="padding:10px 16px;border-bottom:1px solid #334155;color:#64748b;font-size:13px;width:140px">New Date</td>
      <td style="padding:10px 16px;border-bottom:1px solid #334155;color:#f1f5f9;font-weight:600">{{ date }}</td>
    </tr>
    <tr>
      <td style="padding:10px 16px;color:#64748b;font-size:13px">New Time</td>
      <td style="padding:10px 16px;color:#f1f5f9;font-weight:600">{{ time }}</td>
    </tr>
  </table>
  
  <p style="margin:0;color:#94a3b8;font-size:13px;line-height:1.6">
    Questions? Reply to this email or message us on Facebook. We're happy to help.
  </p>
</div>
