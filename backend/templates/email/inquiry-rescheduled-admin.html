<p style="margin:0 0 4px;font-size:11px;font-weight:700;letter-spacing:2px;color:#64748b;text-transform:uppercase">Admin Notification</p>
<h2 style="margin:0 0 20px;font-size:22px;font-weight:900;color:#f1f5f9">Appointment Rescheduled</h2>

<p style="margin:0 0 20px;color:#94a3b8;font-size:14px">The appointment for <strong style="color:#f1f5f9">{{ name }}</strong> was rescheduled.</p>

<div style="background:#162032;border:1px solid #334155;border-radius:8px;overflow:hidden">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
    <tr>
      <td style="padding:10px 16px;border-bottom:1px solid #334155;color:#64748b;font-size:13px;width:120px">Customer</td>
      <td style="padding:10px 16px;border-bottom:1px solid #334155;color:#f1f5f9;font-weight:600">{{ name }}</td>
    </tr>
    <tr>
      <td style="padding:10px 16px;border-bottom:1px solid #334155;color:#64748b;font-size:13px">New Date</td>
      <td style="padding:10px 16px;border-bottom:1px solid #334155;color:#f1f5f9">{{ date }}</td>
    </tr>
    <tr>
      <td style="padding:10px 16px;color:#64748b;font-size:13px">New Time</td>
      <td style="padding:10px 16px;color:#f1f5f9">{{ time }}</td>
    </tr>
  </table>
</div>
<p style="margin:16px 0 0;color:#64748b;font-size:12px">This is an automated system notification.</p>
